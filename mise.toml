[env]
# brew の --global は Brewfile と trust.json を $XDG_CONFIG_HOME 配下で解決する。
# 定義元の ~/.zshenv は bootstrap の終盤で生成されるため、それ以前に走る
# [tasks.packages] のために宣言側で持っておく。
# default にしているのは、既に設定されている値を上書きしないため。
XDG_CONFIG_HOME = { default = "{{env.HOME}}/.config" }

# dotfiles の宣言。`mise bootstrap --yes` でこのファイルの内容にマシンを収束させる。
# 純粋な設定ディレクトリは dir 単位で symlink する (中のファイル追加・削除が自動で反映される)。
# アプリがログや状態を書き込むディレクトリは、それが repo に流れ込まないようファイル単位にする。

[dotfiles]
## ========== ホームディレクトリ直下 ==========
"~/.zshrc" = "home/.zshrc"
"~/.zprofile" = "home/.zprofile"
"~/.gitconfig" = "home/.gitconfig"
"~/.editorconfig" = "home/.editorconfig"

## ========== ~/.local/bin (他のツールが入れた実体と同居するのでファイル単位) ==========
"~/.local/bin/claude-prompt-search" = "home/.local/bin/claude-prompt-search"
"~/.local/bin/git-wt-symlink" = "home/.local/bin/git-wt-symlink"
"~/.local/bin/pushover" = "home/.local/bin/pushover"

## ========== ~/.config (ディレクトリ単位) ==========
"~/.config/abbrs" = "home/.config/abbrs"
"~/.config/alacritty" = "home/.config/alacritty"
"~/.config/cage" = "home/.config/cage"
"~/.config/codebook" = "home/.config/codebook"
"~/.config/gh-dash" = "home/.config/gh-dash"
"~/.config/ghostty" = "home/.config/ghostty"
"~/.config/git" = "home/.config/git"
"~/.config/lazygit" = "home/.config/lazygit"
"~/.config/nvim" = "home/.config/nvim"
"~/.config/octorus" = "home/.config/octorus"
"~/.config/p10k" = "home/.config/p10k"
"~/.config/ripgrep" = "home/.config/ripgrep"
"~/.config/sheldon" = "home/.config/sheldon"
"~/.config/trev" = "home/.config/trev"
"~/.config/wezterm" = "home/.config/wezterm"

## ========== ~/.config (ファイル単位: ランタイム状態が同居する) ==========
# claude: .claude.json や各種キャッシュが同じディレクトリに書かれる
"~/.config/claude/CLAUDE.md" = "home/.config/claude/CLAUDE.md"
"~/.config/claude/settings.json" = "home/.config/claude/settings.json"
"~/.config/claude/keybindings.json" = "home/.config/claude/keybindings.json"
"~/.config/claude/templace.mcp.jsonc" = "home/.config/claude/templace.mcp.jsonc"
"~/.config/claude/_scripts" = "home/.config/claude/_scripts"
"~/.config/claude/output-styles" = "home/.config/claude/output-styles"
"~/.config/claude/rules" = "home/.config/claude/rules"
"~/.config/claude/skills" = "home/.config/claude/skills"
# herdr: サーバー・クライアントのログとプラグインの lock が同居する
"~/.config/herdr/config.toml" = "home/.config/herdr/config.toml"
"~/.config/herdr/nav.sh" = "home/.config/herdr/nav.sh"
# zsh: 補完定義が生成される
"~/.config/zsh/widgets" = "home/.config/zsh/widgets"
# mise: miserc.toml (profile 指定) はマシン固有なので repo では管理しない
"~/.config/mise/config.toml" = "home/.config/mise/config.toml"
# homebrew: brew 自身が trust.json を書き込むディレクトリなのでファイル単位
"~/.config/homebrew/Brewfile" = "home/.config/homebrew/Brewfile"
# hunk: 起動時に state.json を書き込む
"~/.config/hunk/config.toml" = "home/.config/hunk/config.toml"

[bootstrap.macos.defaults.NSGlobalDomain]
KeyRepeat = 2
InitialKeyRepeat = 25
ApplePressAndHoldEnabled = false
AppleShowAllExtensions = true
# メニューバーの項目間隔
NSStatusItemSpacing = 8
NSStatusItemSelectionPadding = 6
# マウス/トラックパッドの軌跡の速さ (0〜3, 最速=3)
"com.apple.mouse.scaling" = 3.0
"com.apple.trackpad.scaling" = 3.0
# スクロールの速さ (システム設定のスライダー相当: 0.125〜7, デフォルト=0.75)
"com.apple.scrollwheel.scaling" = 0.3125

[bootstrap.macos.defaults."com.apple.dock"]
autohide = true
tilesize = 16
mru-spaces = false
autohide-time-modifier = 0.1
autohide-delay = 0.1
# ホットコーナー (左下・右下 → Mission Control)
wvous-bl-corner = 2
wvous-bl-modifier = 0
wvous-br-corner = 2
wvous-br-modifier = 0

[bootstrap.macos.defaults."com.apple.finder"]
ShowPathbar = true
AppleShowAllExtensions = true
FXEnableExtensionChangeWarning = false
_FXShowPosixPathInTitle = true
# 検索は「現在のフォルダ」から
FXDefaultSearchScope = "SCcf"
NewWindowTarget = "PfDe"

[bootstrap.macos.defaults."com.apple.AppleMultitouchTrackpad"]
Clicking = false
TrackpadThreeFingerDrag = false
# 3本指の縦スワイプ → Mission Control
TrackpadThreeFingerVertSwipeGesture = 2

[bootstrap.macos.defaults."com.apple.driver.AppleBluetoothMultitouch.trackpad"]
Clicking = false
TrackpadThreeFingerDrag = false

[bootstrap.macos.defaults."com.apple.LaunchServices"]
LSQuarantine = false

[bootstrap.macos.defaults."com.apple.menuextra.clock"]
Show24Hour = true
ShowSeconds = true
FlashDateSeparators = true

[bootstrap.macos.defaults."com.apple.menuextra.battery"]
ShowPercent = "YES"

[bootstrap.macos.defaults."com.apple.desktopservices"]
# ネットワークボリュームに .DS_Store を作らない
DSDontWriteNetworkStores = true

[bootstrap.macos.defaults."com.jordanbaird.Ice"]
SUEnableAutomaticChecks = false
SUAutomaticallyUpdate = false
SUSendProfileInfo = false
# Ice Bar (ポップアップ式メニューバー) を使う
UseIceBar = true
IceBarLocation = 2
# 常時非表示セクションを有効化
EnableAlwaysHiddenSection = true
ShowAllSectionsOnUserDrag = true
HideApplicationMenus = true
# 自動再非表示
AutoRehide = true
RehideStrategy = 0
RehideInterval = 15

[bootstrap.files."/etc/pam.d/sudo_local"]
# Touch ID で sudo 認証。sudo への昇格は mise が行う
content = "auth       sufficient     pam_tid.so\n"

[bootstrap.hooks]
pre-defaults = "mkdir -p ~/Downloads/_screenshot"
# [bootstrap.macos.defaults] で表現できない設定を補い、最後に変更を反映させる。
# ネストした辞書 (NSUserKeyEquivalents / AppleSymbolicHotKeys) と、
# 絶対パスが必要な値 (~ はリテラルとして書かれてしまう) はここで直接書く。
post-defaults = '''
# azooKey の「いい感じ変換」を F12 (U+F70F は F12 の私用領域コード) に割り当てる
F12=$(printf '\xef\x9c\x8f')
defaults write -g NSUserKeyEquivalents -dict-add "いい感じ変換" "$F12"
defaults write -g NSUserKeyEquivalents -dict-add "いい感じ変換（無効/バックエンドなし）" "$F12"

# 他のキーバインドと衝突するショートカットを無効化する
# 52: Dock 自動表示/非表示, 60/61: 入力ソース切替, 64: Spotlight, 65: Finder 検索,
# 28-31/184: スクリーンショット各種
for key in 52 60 61 64 65 28 29 30 31 184; do
  defaults write com.apple.symbolichotkeys AppleSymbolicHotKeys \
    -dict-add "$key" "<dict><key>enabled</key><false/></dict>"
done

# NewWindowTarget ([bootstrap.macos.defaults]) と対になる値
defaults write com.apple.finder NewWindowTargetPath -string "file://$HOME/"

defaults write com.apple.screencapture location -string "$HOME/Downloads/_screenshot"

/System/Library/PrivateFrameworks/SystemAdministration.framework/Resources/activateSettings -u || true
killall Dock Finder SystemUIServer 2>/dev/null || true
'''

# mise bootstrap が dotfiles とツールを収束させた後に呼ぶ (bootstrap の最終ステップ)。
# 宣言では表せない生成物 (シークレット / 外部リソース / ビルド成果物) をここで作る。
[tasks.bootstrap]
description = "生成物とパッケージを収束させる (secrets / externals / karabiner / terminfo / Brewfile)"
run = [
  "mise run secrets",
  "mise run externals",
  "mise run karabiner-build",
  "bash {{config_root}}/scripts/install-terminfo.sh",
  "mise run packages",
]

[tasks.packages]
description = "Brewfile を適用 (宣言から外れたものは削除する)"
run = '''
# Homebrew 6 以降はサードパーティ tap を明示的に信頼しないと formula を読み込めない。
# tap が0件でも中断しないよう、抽出は grep ではなく perl で行う
perl -ne 'print "$1\n" if /^tap "([^"]+)"/' "$HOME/.config/homebrew/Brewfile" \
  | while read -r tap; do brew trust --tap "$tap"; done
brew bundle install --global
# install --cleanup は Homebrew 6 で deprecated になった。cleanup は独立したサブコマンド
brew bundle cleanup --global --force
'''

[tasks.update]
description = "パッケージと dev ツールを更新"
run = [
  "brew update",
  "brew upgrade",
  "mise run packages",
  "mise upgrade",
]

[tasks.secrets]
description = "1Password から ~/.zshenv を生成"
run = "op inject -f -i {{config_root}}/templates/zshenv.tpl -o {{env.HOME}}/.zshenv"

[tasks.karabiner-build]
description = "Karabiner 設定をビルド"
dir = "{{config_root}}"
run = "deno run --allow-env --allow-read --allow-write karabiner/main.ts"

[tasks.karabiner-watch]
description = "Karabiner 設定を watch ビルド"
dir = "{{config_root}}"
run = "deno run --allow-env --allow-read --allow-write --watch karabiner/main.ts"

[tasks.externals]
description = "nix-direnv の direnvrc を取得 (30日ごとに更新)"
run = '''
dest="$HOME/.config/direnv/lib/nix-direnv.sh"
if [ ! -e "$dest" ] || [ -z "$(find "$dest" -mtime -30 2>/dev/null)" ]; then
  mkdir -p "$(dirname "$dest")"
  curl -fsSL https://raw.githubusercontent.com/nix-community/nix-direnv/master/direnvrc -o "$dest.tmp"
  mv "$dest.tmp" "$dest"
  echo "fetched: $dest"
fi
'''

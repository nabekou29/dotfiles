# unison-fsmonitor: brew の unison formula に同梱されないため公式リリースから取得
# (バージョンは brew の unison と揃える。brew upgrade で unison が上がったら URL も更新する)
".local/bin/unison-fsmonitor":
    type: archive-file
    url: https://github.com/bcpierce00/unison/releases/download/v2.54.0/unison-2.54.0-macos-arm64.tar.gz
    path: bin/unison-fsmonitor
    executable: true

# nix-direnv: `use flake` の dev shell をキャッシュして cd のたびの再評価を防ぐ
# (direnv は $XDG_CONFIG_HOME/direnv/lib/*.sh を自動 source する)
".config/direnv/lib/nix-direnv.sh":
    type: file
    url: https://raw.githubusercontent.com/nix-community/nix-direnv/master/direnvrc
    refreshPeriod: 720h

".config/tmux/plugins/tpm":
    type: archive
    url: https://github.com/tmux-plugins/tpm/archive/master.tar.gz
    exact: true
    stripComponents: 1
    refreshPeriod: 168h

".config/zellij/plugins/zjstatus.wasm":
    type: file
    url: https://github.com/dj95/zjstatus/releases/latest/download/zjstatus.wasm
    refreshPeriod: 168h

".config/zellij/scripts/battery.sh":
    type: file
    url: https://raw.githubusercontent.com/dracula/tmux/master/scripts/battery.sh
    executable: true
    refreshPeriod: 720h

".config/zellij/scripts/cpu_info.sh":
    type: file
    url: https://raw.githubusercontent.com/dracula/tmux/master/scripts/cpu_info.sh
    executable: true
    refreshPeriod: 720h

".config/zellij/scripts/ram_info.sh":
    type: file
    url: https://raw.githubusercontent.com/dracula/tmux/master/scripts/ram_info.sh
    executable: true
    refreshPeriod: 720h

".config/zellij/scripts/weather.sh":
    type: file
    url: https://raw.githubusercontent.com/dracula/tmux/master/scripts/weather.sh
    executable: true
    refreshPeriod: 720h

".config/zellij/scripts/utils.sh":
    type: file
    url: https://raw.githubusercontent.com/dracula/tmux/master/scripts/utils.sh
    executable: true
    refreshPeriod: 720h
